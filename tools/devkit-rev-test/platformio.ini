; ESP32-S3-DevKitC-1 board-revision test
; Determines which GPIO drives the onboard RGB LED:
;   v1.1 -> GPIO 38   (so GPIO 48 is FREE for PC-cool PWM)
;   v1.0 -> GPIO 48   (GPIO 48 drives the LED -> conflicts with PC-cool PWM)
;
; Toolchain pinned to match the main Key Light Controller firmware
; (platformio/espressif32 6.12.0 == Arduino-ESP32 core 2.0.17), so flashing/USB-CDC
; behaves exactly as it will for the real firmware.

[env:esp32-s3-devkitc-1]
platform  = platformio/espressif32 @ 6.12.0
board     = esp32-s3-devkitc-1
framework = arduino

board_build.flash_size          = 16MB
board_upload.flash_size         = 16MB
board_build.arduino.memory_type = qio_opi

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM

monitor_speed   = 115200
monitor_filters = direct

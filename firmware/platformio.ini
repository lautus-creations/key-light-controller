; CCTRL Key Light Controller firmware, ESP32-S3-DevKitC-1
; PlatformIO / Arduino framework (arduino-esp32 2.0.17)

[env:esp32-s3-devkitc-1]
; Pinned: platformio/espressif32 6.12.0 = arduino-esp32 2.0.17 (framework 3.20017).
; Keep the "platformio/" owner prefix so a pioarduino espressif32 platform
; (Arduino core 3.x, not compatible) is never picked up.
platform     = platformio/espressif32 @ 6.12.0
board        = esp32-s3-devkitc-1
framework    = arduino

board_build.flash_size            = 16MB
board_build.partitions            = default_16MB.csv
board_upload.flash_size           = 16MB
board_build.arduino.memory_type   = qio_opi

; TFT_eSPI is configured here (USER_SETUP_LOADED) because the library's own
; User_Setup.h under .pio/libdeps is overwritten by a clean or library update.
; include/User_Setup.h is reference only.
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DUSER_SETUP_LOADED=1
    -DST7796_DRIVER=1
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=480
    -DTFT_CS=10
    -DTFT_DC=9
    -DTFT_RST=8
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_MISO=13
    -DTFT_INVERSION_ON=1
    -DTFT_RGB_ORDER=TFT_BGR
    -DSPI_FREQUENCY=27000000
    -DSPI_READ_FREQUENCY=20000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DLV_CONF_PATH=../../../../../lv_conf.h

; LV_CONF_PATH: LVGL reads lv_conf.h (project root) directly, so nothing is
; copied into .pio. The path is relative to .pio/libdeps/<env>/lvgl/src/,
; the folder of lv_conf_internal.h, which does the #include.
; Libraries pinned so every machine builds the same code: TFT_eSPI from GitHub
; at commit 16e3759 (library.json 2.5.43), LVGL 8.4.0.
lib_deps =
    https://github.com/Bodmer/TFT_eSPI.git#16e37595040eac69cd628e4bffb56fc30cad6299
    lvgl/lvgl @ 8.4.0

; Rewrites build paths embedded via __FILE__ so the image carries no local
; user folder names. See strip_build_paths.py.
extra_scripts = pre:strip_build_paths.py

monitor_speed   = 115200
monitor_filters = direct, send_on_enter
monitor_echo    = yes
monitor_eol     = LF
